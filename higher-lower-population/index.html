<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkerlab — Higher or Lower: Country Population</title>
<meta name="description" content="Which country has more people? A free higher-or-lower population game."><!-- tl-meta -->
<meta property="og:title" content="Tinkerlab — Higher or Lower: Country Population">
<meta property="og:description" content="Which country has more people? A free higher-or-lower population game.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tinkerlab">

<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #eafaf0 0%, #f0fbf3 50%, #f6fef8 100%); margin: 0; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; min-height: 100vh; }
  a.back { color: #666; font-size: 0.85rem; margin-bottom: 16px; text-decoration: none; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .tag { color: #666; font-size: 0.9rem; margin-top: 4px; }
  .scoreboard { display: flex; gap: 24px; margin-bottom: 20px; font-size: 0.95rem; }
  .scoreboard div { text-align: center; }
  .scoreboard .num { font-size: 1.4rem; font-weight: 700; }
  .stack { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
  .item-card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 22px 20px; text-align: center; }
  .item-card.reference { background: #eafaf0; }
  .item-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
  .item-value { font-size: 1.3rem; font-weight: 700; color: #2f7d4f; }
  .versus { text-align: center; color: #aaa; font-size: 0.8rem; margin: -2px 0; }
  .guess-buttons { display: flex; gap: 10px; margin-top: 10px; }
  .guess-buttons button { flex: 1; padding: 14px; border-radius: 10px; border: 2px solid #ddd; background: white; font-size: 1rem; cursor: pointer; transition: all 0.15s; }
  .guess-buttons button:hover { border-color: #2f7d4f; background: #f2fef6; }
  .guess-buttons button:disabled { cursor: default; }
  .result-badge { font-weight: 700; font-size: 0.95rem; margin-top: 8px; }
  .result-badge.correct { color: #1a9c4a; }
  .result-badge.wrong { color: #d9364a; }
  .next-btn { margin-top: 6px; padding: 12px 28px; border-radius: 10px; border: none; background: #111; color: white; font-size: 1rem; cursor: pointer; display: none; align-self: center; }
  .report { margin-top: 22px; text-align: center; }
  .report button { background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
  footer { margin-top: 30px; color: #999; font-size: 0.8rem; text-align: center; }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/consent.js"></script>
</head>
<body>

<a class="back" href="/">← Back to Tinkerlab</a>

<header>
  <h1>👥 Higher or Lower</h1>
  <div class="tag">Which country has more people?</div>
</header>

<div class="scoreboard">
  <div><div class="num" id="score">0</div>Correct</div>
  <div><div class="num" id="streak">0</div>Streak</div>
  <div><div class="num" id="best">0</div>Best Streak</div>
</div>

<div class="stack">
  <div class="item-card reference" id="refCard"></div>
  <div class="versus">vs</div>
  <div class="item-card" id="candidateCard"></div>
  <div class="guess-buttons" id="guessButtons">
    <button id="lowerBtn">⬇️ Lower</button>
    <button id="higherBtn">Higher ⬆️</button>
  </div>
  <div class="result-badge" id="resultBadge"></div>
  <button class="next-btn" id="nextBtn">Next →</button>
</div>

<div class="report"><button id="reportBtn">🚩 Report an error in this question</button></div>

<footer>tinkerlab.fyi<br>For entertainment only — facts on this page have not yet been independently verified, and figures are approximate.<br><a href="/privacy/" style="color:#999;">Privacy</a></footer>

<script>
  // Each entry: country, its approximate value, for comparison.
  const items = [{"title": "China", "value": 1425}, {"title": "India", "value": 1428}, {"title": "United States", "value": 335}, {"title": "Indonesia", "value": 277}, {"title": "Pakistan", "value": 240}, {"title": "Nigeria", "value": 223}, {"title": "Brazil", "value": 216}, {"title": "Bangladesh", "value": 173}, {"title": "Russia", "value": 144}, {"title": "Mexico", "value": 128}, {"title": "Japan", "value": 124}, {"title": "Ethiopia", "value": 126}, {"title": "Philippines", "value": 117}, {"title": "Egypt", "value": 112}, {"title": "Vietnam", "value": 98}, {"title": "Turkey", "value": 85}, {"title": "Germany", "value": 84}, {"title": "Thailand", "value": 72}, {"title": "United Kingdom", "value": 68}, {"title": "France", "value": 68}, {"title": "Italy", "value": 59}, {"title": "South Africa", "value": 60}, {"title": "Kenya", "value": 55}, {"title": "Argentina", "value": 46}, {"title": "Poland", "value": 37}, {"title": "Canada", "value": 39}, {"title": "Australia", "value": 26}, {"title": "Netherlands", "value": 18}, {"title": "Sweden", "value": 11}, {"title": "Switzerland", "value": 9}, {"title": "New Zealand", "value": 5}, {"title": "Iceland", "value": 0.4}, {"title": "Colombia", "value": 52}, {"title": "Spain", "value": 48}, {"title": "Uganda", "value": 48}, {"title": "Sudan", "value": 48}, {"title": "Iraq", "value": 45}, {"title": "Afghanistan", "value": 42}, {"title": "Ukraine", "value": 37}, {"title": "Morocco", "value": 37}, {"title": "Saudi Arabia", "value": 36}, {"title": "Uzbekistan", "value": 35}, {"title": "Peru", "value": 34}, {"title": "Malaysia", "value": 34}, {"title": "Ghana", "value": 34}, {"title": "Mozambique", "value": 34}, {"title": "Yemen", "value": 34}, {"title": "Nepal", "value": 30}, {"title": "Madagascar", "value": 30}, {"title": "Venezuela", "value": 28}, {"title": "Cameroon", "value": 28}, {"title": "Ivory Coast", "value": 28}, {"title": "North Korea", "value": 26}, {"title": "Sri Lanka", "value": 22}, {"title": "Chile", "value": 19}, {"title": "Romania", "value": 19}, {"title": "Cuba", "value": 11}, {"title": "Greece", "value": 10}, {"title": "Portugal", "value": 10}, {"title": "Austria", "value": 9.1}, {"title": "Czechia", "value": 10.9}, {"title": "Ireland", "value": 5.1}];

  function formatValue(v) { return "~" + v.toLocaleString() + " million people"; }

  let score = 0, streak = 0, best = 0;
  let reference = null, candidate = null, locked = false;
  const $ = id => document.getElementById(id);
  best = parseInt(localStorage.getItem("tinkerlab_higherlower_population_best") || "0", 10);
  $("best").textContent = best;

  function pickCandidate(excludeTitle) {
    const pool = items.filter(g => g.title !== excludeTitle);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function renderRefCard() {
    $("refCard").innerHTML =
      '<div class="item-title">' + reference.title + '</div>' +
      '<div class="item-value">' + formatValue(reference.value) + '</div>';
  }

  function newRound() {
    locked = false;
    candidate = pickCandidate(reference.title);
    $("candidateCard").innerHTML = '<div class="item-title">' + candidate.title + '</div>';
    $("resultBadge").textContent = "";
    $("nextBtn").style.display = "none";
    $("guessButtons").style.display = "flex";
    $("lowerBtn").disabled = false;
    $("higherBtn").disabled = false;
  }

  function startGame() {
    reference = pickCandidate("");
    renderRefCard();
    newRound();
  }

  function handleGuess(guessLower) {
    if (locked) return;
    locked = true;
    $("lowerBtn").disabled = true;
    $("higherBtn").disabled = true;

    const isLower = candidate.value < reference.value;
    const correct = guessLower === isLower || candidate.value === reference.value;

    $("candidateCard").innerHTML =
      '<div class="item-title">' + candidate.title + '</div>' +
      '<div class="item-value">' + formatValue(candidate.value) + '</div>';

    if (correct) {
      $("resultBadge").textContent = "✅ Correct!";
      $("resultBadge").className = "result-badge correct";
      score++; streak++;
      if (streak > best) { best = streak; try { localStorage.setItem("tinkerlab_higherlower_population_best", best); } catch (e) {} }
    } else {
      $("resultBadge").textContent = "❌ Not quite.";
      $("resultBadge").className = "result-badge wrong";
      streak = 0;
    }
    reference = candidate;

    $("score").textContent = score;
    $("streak").textContent = streak;
    $("best").textContent = best;
    $("guessButtons").style.display = "none";
    $("nextBtn").style.display = "inline-block";
  }

  $("lowerBtn").onclick = () => handleGuess(true);
  $("higherBtn").onclick = () => handleGuess(false);
  $("nextBtn").onclick = () => { renderRefCard(); newRound(); };

  const REPORT_EMAIL = "hello@rssolutions.uk";
  $("reportBtn").onclick = () => {
    const body = "Game: Higher or Lower (Country Population)\nReference: " + reference.title + " (" + formatValue(reference.value) + ")\nCandidate: " + candidate.title + " (" + formatValue(candidate.value) + ")\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };

  startGame();
</script>

</body>
</html>
