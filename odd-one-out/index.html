one","Ron"],"Frodo","The other three are from Harry Potter."],[["Thor","Hulk","Iron Man"],"Batman","The other three are Marvel heroes. Batman is DC."],[["Mario","Sonic","Pac-Man"],"Bugs Bunny","The other three are video game characters. Bugs Bunny is a cartoon character."],[["Red","Blue","Yellow"],"Green","Red, blue and yellow are the traditional primary colours for painting. Green is a mix."],[["January","March","May"],"June","The other three have 31 days. June has 30."],[["2","3","7"],"9","The other three are prime numbers. 9 is 3 × 3."],[["Oxford","Cambridge","Durham"],"Stanford","The other three are UK universities. Stanford is in California."],[["Ford","Tesla","BMW"],"Boeing","The other three make cars. Boeing makes aircraft."],[["Violin","Cello","Viola"],"Trumpet","The other three are string instruments. The trumpet is brass."],[["Mount Everest","K2","Kangchenjunga"],"Mont Blanc","The other three are over 8,000 metres. Mont Blanc is 4,808 metres."],[["Pacific","Atlantic","Indian"],"Mediterranean","The other three are oceans. The Mediterranean is a sea."],[["Boeing 747","Airbus A380","Concorde"],"Titanic","The other three are aircraft. The Titanic was a ship."],[["Sherlock Holmes","Poirot","Miss Marple"],"Gandalf","The other three are fictional detectives."],[["Metre","Kilogram","Litre"],"Mile","The other three are metric units. The mile is imperial."],[["Mars","Twix","Snickers"],"Pringles","The other three are chocolate bars. Pringles are crisps."],[["Nile","Amazon","Yangtze"],"Everest","Everest is a mountain. The other three are rivers."],[["Baseball","Cricket","Softball"],"Rugby","The other three are bat-and-ball games."],[["Fahrenheit","Celsius","Kelvin"],"Newton","The other three are temperature scales. The newton measures force."],[["Trout","Salmon","Cod"],"Dolphin","The other three are fish."],[["Tulip","Rose","Daisy"],"Oak","The other three are flowers. The oak is a tree."],[["Sitar","Tabla","Veena"],"Banjo","The other three are traditional Indian instruments."],[["Ruby","Emerald","Sapphire"],"Pearl","The other three are gemstones cut from minerals. A pearl is made by an oyster."],[["Jupiter","Saturn","Neptune"],"Earth","The other three are gas or ice giants."],[["Cumulus","Stratus","Cirrus"],"Monsoon","The other three are cloud types."],[["Tokyo","Osaka","Kyoto"],"Seoul","The other three are Japanese cities."],[["Bishop","Knight","Rook"],"Jack","The other three are chess pieces."],[["Sonnet","Haiku","Limerick"],"Novel","The other three are forms of poetry."],[["Venice","Florence","Naples"],"Lyon","The other three are Italian cities."],[["Cello","Piano","Harp"],"Drum","The other three have strings. A drum has a skin."],[["Python","Cobra","Viper"],"Iguana","The other three are snakes. An iguana is a lizard."],[["Salsa","Tango","Waltz"],"Opera","The other three are dances."],[["Argentina","Uruguay","Paraguay"],"Mexico","The other three are in South America."],[["Kayak","Canoe","Gondola"],"Bicycle","The other three are boats."],[["Cardiff","Belfast","Edinburgh"],"Dublin","The other three are UK capitals. Dublin is in Ireland."],[["Lionel Messi","Kylian Mbappé","Erling Haaland"],"Lewis Hamilton","The other three are footballers. Hamilton drives in Formula 1."],[["LeBron James","Stephen Curry","Kevin Durant"],"Patrick Mahomes","The other three are NBA players. Mahomes plays in the NFL."],[["Rugby","Hockey","Lacrosse"],"Chess","The other three are team sports played on a field."],[["Mont Blanc","Monte Rosa","Eiger"],"Ben Nevis","The other three are in the Alps. Ben Nevis is in Scotland."],[["Thames","Seine","Tiber"],"Mississippi","The other three flow through European capitals. The Mississippi is in the USA."],[["Pyramids of Giza","Colosseum","Parthenon"],"Eiffel Tower","The other three are ancient monuments. The Eiffel Tower was built in 1889."],[["Lasagne","Ravioli","Tortellini"],"Pierogi","The other three are Italian pasta dishes. Pierogi are Polish dumplings."],[["Vodka","Gin","Rum"],"Cider","The other three are spirits. Cider is a fermented apple drink."],[["Saxophone","Clarinet","Oboe"],"Trombone","The other three are woodwind instruments. The trombone is brass."],[["Parsley","Rosemary","Sage"],"Cinnamon","The other three are herbs. Cinnamon is a spice."],[["Hockey","Curling","Skiing"],"Surfing","The other three are winter sports."]];
  const $ = id => document.getElementById(id);
  let score = 0, streak = 0, best = 0, cur = null, last = -1, locked = false;
  try { best = parseInt(localStorage.getItem("tinkerlab_oddone_best") || "0", 10); } catch (e) {}
  $("best").textContent = best;
  const shuffle = a => a.slice().sort(() => Math.random() - 0.5);
  function newRound() {
    let i; do { i = Math.floor(Math.random() * SETS.length); } while (i === last && SETS.length > 1);
    last = i; cur = SETS[i]; locked = false;
    const opts = shuffle(cur[0].concat([cur[1]]));
    $("opts").innerHTML = "";
    opts.forEach(o => { const b = document.createElement("button"); b.textContent = o; b.onclick = () => pick(b, o); $("opts").appendChild(b); });
    $("why").textContent = ""; $("nextBtn").style.display = "none";
  }
  function pick(btn, o) {
    if (locked) return; locked = true;
    const all = $("opts").querySelectorAll("button"); all.forEach(b => b.disabled = true);
    if (o === cur[1]) { btn.classList.add("right"); score++; streak++; if (streak > best) { best = streak; try { localStorage.setItem("tinkerlab_oddone_best", best); } catch (e) {} } }
    else { btn.classList.add("wrong"); streak = 0; all.forEach(b => { if (b.textContent === cur[1]) b.classList.add("right"); }); }
    $("why").textContent = (o === cur[1] ? "✅ " : "❌ ") + cur[1] + " is the odd one out. " + cur[2];
    $("score").textContent = score; $("streak").textContent = streak; $("best").textContent = best;
    $("nextBtn").style.display = "block";
  }
  $("nextBtn").onclick = newRound;
  const REPORT_EMAIL = "hello@rssolutions.uk";
  $("reportBtn").onclick = () => {
    const body = "Game: Odd One Out\nSet: " + (cur ? cur[0].join(", ") + " + " + cur[1] : "") + "\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };
  newRound();
</script>
