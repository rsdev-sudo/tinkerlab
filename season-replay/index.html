      if (!tiers.length) continue;
      const t = tiers[Math.floor(Math.random() * tiers.length)];
      const rows = TABLES[s][t];
      return { season: s, tier: t, rows, hide: Math.floor(Math.random() * rows.length) };
    }
  }
  function drawTable() {
    $("title").textContent = TN[cur.tier] + " " + cur.season;
    $("tbl").innerHTML = cur.rows.map((r, i) => {
      const hidden = i === cur.hide && roundActive;
      const reveal = i === cur.hide && !roundActive;
      const cls = hidden ? "hidden" : reveal ? "reveal" : "";
      const nm = hidden ? "❓ ???" : r[0];
      return '<tr class="' + cls + '"><td class="p">' + (i + 1) + '</td><td>' + nm + '</td><td class="pts">' + (r[1] === null ? "" : r[1]) + '</td></tr>';
    }).join("");
  }
  const names = () => { const set = new Set(); Object.values(TABLES).forEach(a => a.forEach(t => t && t.forEach(r => set.add(r[0])))); return Array.from(set).sort(); };
  const allNames = names();
  const input = $("guessInput"), sugg = $("suggestions");
  function matchName(t) { t = t.trim().toLowerCase(); return allNames.find(x => x.toLowerCase() === t) || null; }
  function updateGuessState() { const ok = roundActive && !!matchName(input.value); $("guessBtn").disabled = !ok; $("hint").textContent = roundActive && !ok ? "Pick a club from the dropdown to enable Guess." : ""; }
  function filtered() { const q = input.value.trim().toLowerCase(); return allNames.filter(n => n.toLowerCase().includes(q)); }
  function renderSugg() {
    if (!roundActive) return; const list = filtered(); sugg.innerHTML = "";
    if (!list.length) { const d = document.createElement("div"); d.className = "none"; d.textContent = "No matching club"; sugg.appendChild(d); }
    else list.forEach(n => { const d = document.createElement("div"); d.textContent = n; d.onmousedown = e => { e.preventDefault(); input.value = n; sugg.style.display = "none"; updateGuessState(); }; sugg.appendChild(d); });
    sugg.style.display = "block";
  }
  input.addEventListener("focus", renderSugg);
  input.addEventListener("input", () => { renderSugg(); updateGuessState(); });
  input.addEventListener("blur", () => setTimeout(() => { sugg.style.display = "none"; }, 120));
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !$("guessBtn").disabled) handleGuess(); });
  function newRound() {
    cur = pick(); roundActive = true; drawTable();
    $("resultMsg").textContent = ""; $("resultMsg").className = "result-msg"; input.value = ""; input.disabled = false; $("nextBtn").style.display = "none"; updateGuessState();
  }
  function handleGuess() {
    const m = matchName(input.value); if (!roundActive || !m) return;
    roundActive = false; input.disabled = true; sugg.style.display = "none"; $("guessBtn").disabled = true; $("hint").textContent = "";
    const ans = cur.rows[cur.hide][0];
    if (m === ans) { $("resultMsg").textContent = "✅ Correct — " + ans + "!"; $("resultMsg").className = "result-msg correct"; score++; streak++; if (streak > best) { best = streak; try { localStorage.setItem("tinkerlab_replay_best", best); } catch (e) {} } }
    else { $("resultMsg").textContent = "❌ Not quite — it was " + ans + "."; $("resultMsg").className = "result-msg wrong"; streak = 0; }
    $("score").textContent = score; $("streak").textContent = streak; $("best").textContent = best;
    drawTable(); $("nextBtn").style.display = "block";
  }
  $("guessBtn").onclick = handleGuess; $("nextBtn").onclick = newRound;
  function buildModes() {
    $("modes").innerHTML = "";
    [["All", -1], ["Premier League", 0], ["Championship", 1], ["League One", 2], ["League Two", 3]].forEach(([l, v]) => {
      const b = document.createElement("button"); b.textContent = l; b.className = v === tierFilter ? "on" : ""; b.onclick = () => { tierFilter = v; buildModes(); newRound(); }; $("modes").appendChild(b);
    });
  }
  const REPORT_EMAIL = "hello@rssolutions.uk";
  $("reportBtn").onclick = () => {
    const body = "Game: Season Replay\nTable: " + (cur ? TN[cur.tier] + " " + cur.season : "") + "\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };
  buildModes(); newRound();
</script>

</body>
</html>
