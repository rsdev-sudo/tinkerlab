<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eaf2ff 0%, #eef1ff 50%, #f2eeff 100%);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    min-height: 100vh;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .tag { color: #666; font-size: 0.9rem; margin-top: 4px; }
  a.back { color: #666; font-size: 0.85rem; margin-bottom: 16px; text-decoration: none; }
  .modes { display: flex; gap: 8px; margin-bottom: 16px; }
  .modes button { padding: 8px 20px; border-radius: 20px; border: 2px solid #ccc; background: white; cursor: pointer; font-size: 0.9rem; }
  .modes button.active { background: #111; color: white; border-color: #111; }
  .scoreboard { display: flex; gap: 24px; margin-bottom: 20px; font-size: 0.95rem; }
  .scoreboard div { text-align: center; }
  .scoreboard .num { font-size: 1.4rem; font-weight: 700; }
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 28px 20px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .clue { font-size: 1.15rem; margin-bottom: 24px; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button.option {
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #ddd;
    background: white;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  button.option:hover { border-color: #999; }
  button.option.correct { background: #d4f7dc; border-color: #34c759; }
  button.option.wrong { background: #fbd6d6; border-color: #ff3b30; }
  button.option:disabled { cursor: default; }
  .next-btn {
    margin-top: 20px;
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    background: #111;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    display: none;
  }
  .report { margin-top: 22px; text-align: center; }
  .report button { background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
  footer { margin-top: 30px; color: #999; font-size: 0.8rem; }
</style>
<script>

</head>
<body>

<a class="back" href="/">← Back to Tinkerlab</a>

<header>
  <h1>🕒 Guess the Timezone</h1>
  <div class="tag" id="tag">One clue. Four UTC offsets. Where in the world is it?</div>
</header>

<div class="modes">
  <button id="easyBtn">Easy</button>
  <button id="hardBtn">Hard</button>
</div>

<div class="scoreboard">
  <div><div class="num" id="score">0</div>Score</div>
  <div><div class="num" id="streak">0</div>Streak</div>
  <div><div class="num" id="best">0</div>Best Streak</div>
</div>

<div class="card">
  <div class="clue" id="clue">Loading...</div>
  <div class="options" id="options"></div>
  <button class="next-btn" id="nextBtn">Next →</button>
</div>

<div class="report"><button id="reportBtn">🚩 Report an error in this question</button></div>

<footer>tinkerlab.fyi<br>For entertainment only — facts on this page have not yet been independently verified.<br><a href="/privacy/" style="color:#999;">Privacy</a></footer>

<script>
  // ---- DATASET ----
  // Each entry: a place/clue, the correct UTC offset, and 3 wrong offsets to mix in.
  const questions = [
    { city: "Tokyo", clue: "Tokyo, Japan", answer: "UTC+9", wrong: ["UTC+8", "UTC+7", "UTC+10"] },
    { city: "London", clue: "London, United Kingdom (winter time)", answer: "UTC+0", wrong: ["UTC+1", "UTC-1", "UTC+2"] },
    { city: "New York City", clue: "New York City, USA (standard time)", answer: "UTC-5", wrong: ["UTC-4", "UTC-6", "UTC-8"] },
    { city: "Sydney", clue: "Sydney, Australia (standard time)", answer: "UTC+10", wrong: ["UTC+9", "UTC+11", "UTC+8"] },
    { city: "Dubai", clue: "Dubai, United Arab Emirates", answer: "UTC+4", wrong: ["UTC+3", "UTC+5", "UTC+2"] },
    { city: "Mumbai", clue: "Mumbai, India", answer: "UTC+5:30", wrong: ["UTC+5", "UTC+6", "UTC+4:30"] },
    { city: "Moscow", clue: "Moscow, Russia", answer: "UTC+3", wrong: ["UTC+2", "UTC+4", "UTC+1"] },
    { city: "Los Angeles", clue: "Los Angeles, USA (standard time)", answer: "UTC-8", wrong: ["UTC-7", "UTC-9", "UTC-6"] },
    { city: "Rio de Janeiro", clue: "Rio de Janeiro, Brazil", answer: "UTC-3", wrong: ["UTC-2", "UTC-4", "UTC-5"] },
    { city: "Cairo", clue: "Cairo, Egypt", answer: "UTC+2", wrong: ["UTC+1", "UTC+3", "UTC+4"] },
    { city: "Beijing", clue: "Beijing, China", answer: "UTC+8", wrong: ["UTC+7", "UTC+9", "UTC+6"] },
    { city: "Auckland", clue: "Auckland, New Zealand (standard time)", answer: "UTC+12", wrong: ["UTC+11", "UTC+13", "UTC+10"] },
    { city: "Reykjavik", clue: "Reykjavik, Iceland", answer: "UTC+0", wrong: ["UTC-1", "UTC+1", "UTC-2"] },
    { city: "Nairobi", clue: "Nairobi, Kenya", answer: "UTC+3", wrong: ["UTC+2", "UTC+4", "UTC+1"] },
    { city: "Honolulu", clue: "Honolulu, Hawaii, USA", answer: "UTC-10", wrong: ["UTC-9", "UTC-11", "UTC-8"] },
    { city: "Lagos", clue: "Lagos, Nigeria", answer: "UTC+1", wrong: ["UTC+0", "UTC+2", "UTC+3"] },
    { city: "Johannesburg", clue: "Johannesburg, South Africa", answer: "UTC+2", wrong: ["UTC+1", "UTC+3", "UTC+0"] },
    { city: "Istanbul", clue: "Istanbul, Turkey", answer: "UTC+3", wrong: ["UTC+2", "UTC+1", "UTC+4"] },
    { city: "Athens", clue: "Athens, Greece (winter time)", answer: "UTC+2", wrong: ["UTC+1", "UTC+3", "UTC+0"] },
    { city: "Berlin", clue: "Berlin, Germany (winter time)", answer: "UTC+1", wrong: ["UTC+0", "UTC+2", "UTC+3"] },
    { city: "Lisbon", clue: "Lisbon, Portugal (winter time)", answer: "UTC+0", wrong: ["UTC+1", "UTC-1", "UTC+2"] },
    { city: "Karachi", clue: "Karachi, Pakistan", answer: "UTC+5", wrong: ["UTC+4", "UTC+6", "UTC+5:30"] },
    { city: "Dhaka", clue: "Dhaka, Bangladesh", answer: "UTC+6", wrong: ["UTC+5", "UTC+7", "UTC+5:30"] },
    { city: "Bangkok", clue: "Bangkok, Thailand", answer: "UTC+7", wrong: ["UTC+6", "UTC+8", "UTC+9"] },
    { city: "Jakarta", clue: "Jakarta, Indonesia (Java)", answer: "UTC+7", wrong: ["UTC+8", "UTC+6", "UTC+9"] },
    { city: "Manila", clue: "Manila, Philippines", answer: "UTC+8", wrong: ["UTC+7", "UTC+9", "UTC+10"] },
    { city: "Singapore", clue: "Singapore", answer: "UTC+8", wrong: ["UTC+7", "UTC+9", "UTC+7:30"] },
    { city: "Seoul", clue: "Seoul, South Korea", answer: "UTC+9", wrong: ["UTC+8", "UTC+10", "UTC+7"] },
    { city: "Anchorage", clue: "Anchorage, Alaska, USA (winter time)", answer: "UTC-9", wrong: ["UTC-8", "UTC-10", "UTC-7"] },
    { city: "Denver", clue: "Denver, Colorado, USA (winter time)", answer: "UTC-7", wrong: ["UTC-6", "UTC-8", "UTC-5"] },
    { city: "Chicago", clue: "Chicago, Illinois, USA (winter time)", answer: "UTC-6", wrong: ["UTC-5", "UTC-7", "UTC-8"] },
    { city: "New York", clue: "New York City, USA (winter time)", answer: "UTC-5", wrong: ["UTC-4", "UTC-6", "UTC-3"] },
    { city: "Mexico City", clue: "Mexico City, Mexico", answer: "UTC-6", wrong: ["UTC-5", "UTC-7", "UTC-4"] },
    { city: "Bogotá", clue: "Bogotá, Colombia", answer: "UTC-5", wrong: ["UTC-4", "UTC-6", "UTC-3"] },
    { city: "Buenos Aires", clue: "Buenos Aires, Argentina", answer: "UTC-3", wrong: ["UTC-4", "UTC-2", "UTC-5"] },
    { city: "São Paulo", clue: "São Paulo, Brazil", answer: "UTC-3", wrong: ["UTC-2", "UTC-4", "UTC-5"] },
    { city: "Tehran", clue: "Tehran, Iran", answer: "UTC+3:30", wrong: ["UTC+3", "UTC+4", "UTC+4:30"] },
    { city: "Kathmandu", clue: "Kathmandu, Nepal", answer: "UTC+5:45", wrong: ["UTC+5:30", "UTC+6", "UTC+5"] },
    { city: "Perth", clue: "Perth, Australia", answer: "UTC+8", wrong: ["UTC+9", "UTC+7", "UTC+10"] },
    { city: "Kabul", clue: "Kabul, Afghanistan", answer: "UTC+4:30", wrong: ["UTC+4", "UTC+5", "UTC+5:30"] },
    { city: "Riyadh", clue: "Riyadh, Saudi Arabia", answer: "UTC+3", wrong: ["UTC+2", "UTC+4", "UTC+1"] },
    { city: "Hong Kong", clue: "Hong Kong", answer: "UTC+8", wrong: ["UTC+7", "UTC+9", "UTC+10"] },
    { city: "Vancouver", clue: "Vancouver, Canada (winter time)", answer: "UTC-8", wrong: ["UTC-7", "UTC-9", "UTC-6"] },
    { city: "Toronto", clue: "Toronto, Canada (winter time)", answer: "UTC-5", wrong: ["UTC-4", "UTC-6", "UTC-3"] },
    { city: "Caracas", clue: "Caracas, Venezuela", answer: "UTC-4", wrong: ["UTC-5", "UTC-3", "UTC-4:30"] }
  ];

  let mode = localStorage.getItem("tinkerlab_tz_mode") || "easy";
  let score = 0, streak = 0, current = null;
  const best = {
    easy: parseInt(localStorage.getItem("tinkerlab_tz_best_easy") || "0", 10),
    hard: parseInt(localStorage.getItem("tinkerlab_tz_best_hard") || "0", 10)
  };

  const clueEl = document.getElementById("clue");
  const optionsEl = document.getElementById("options");
  const nextBtn = document.getElementById("nextBtn");
  const scoreEl = document.getElementById("score");
  const streakEl = document.getElementById("streak");
  const bestEl = document.getElementById("best");
  const tagEl = document.getElementById("tag");
  const easyBtn = document.getElementById("easyBtn");
  const hardBtn = document.getElementById("hardBtn");

  function shuffle(arr) {
    return arr.slice().sort(() => Math.random() - 0.5);
  }

  function setMode(m) {
    mode = m;
    try { localStorage.setItem("tinkerlab_tz_mode", m); } catch (e) {}
    streak = 0;
    easyBtn.classList.toggle("active", m === "easy");
    hardBtn.classList.toggle("active", m === "hard");
    tagEl.textContent = m === "easy"
      ? "One clue. Four UTC offsets. Where in the world is it?"
      : "Hard: city name only — no country given.";
    updateScores();
    loadQuestion();
  }

  function updateScores() {
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    bestEl.textContent = best[mode];
  }

  function loadQuestion() {
    current = questions[Math.floor(Math.random() * questions.length)];
    const place = mode === "easy" ? current.clue : current.city;
    clueEl.textContent = "What timezone is " + place + " in?";
    const opts = shuffle([current.answer, ...current.wrong]);

    optionsEl.innerHTML = "";
    opts.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(btn, opt);
      optionsEl.appendChild(btn);
    });
    nextBtn.style.display = "none";
  }

  function handleAnswer(btn, chosen) {
    const allButtons = optionsEl.querySelectorAll("button");
    allButtons.forEach(b => b.disabled = true);

    if (chosen === current.answer) {
      btn.classList.add("correct");
      score++;
      streak++;
      if (streak > best[mode]) {
        best[mode] = streak;
        try { localStorage.setItem("tinkerlab_tz_best_" + mode, best[mode]); } catch (e) {}
      }
    } else {
      btn.classList.add("wrong");
      streak = 0;
      allButtons.forEach(b => {
        if (b.textContent === current.answer) b.classList.add("correct");
      });
    }

    updateScores();
    nextBtn.style.display = "inline-block";
  }

  easyBtn.onclick = () => setMode("easy");
  hardBtn.onclick = () => setMode("hard");
  nextBtn.onclick = loadQuestion;

  const REPORT_EMAIL = "hello@rssolutions.uk";
  document.getElementById("reportBtn").onclick = () => {
    const body = "Game: Guess the Timezone\nPlace: " + current.clue + "\nAnswer in game: " + current.answer + "\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };

  setMode(mode);
</script>

</body>
</html>
