  if (ok) { streak++; if (streak > best) { best = streak; store("tinkerlab_rise_best", String(best)); } } else streak = 0;
  $("streak").textContent = streak; $("best").textContent = best; $("fb").innerHTML = ok ? "<b>Correct!</b>" : "<b>Not quite.</b>";
  $("next").style.display = ""; ev("rise_fall_answer", { correct: ok });
}
$("next").onclick = newQ;
function show() { $("explore").style.display = mode === "explore" ? "" : "none"; $("play").style.display = mode === "play" ? "" : "none"; $("dirTabs").parentNode.style.display = ""; if (mode === "explore") renderExplore(); else { streak = 0; $("streak").textContent = 0; newQ(); } }
tabs("sportTabs", sportTabsItems(), sport, function (k) { sport = k; show(); });
tabs("modeTabs", [["explore", "Biggest moves"], ["play", "Play"]], mode, function (m) { mode = m; show(); });
tabs("dirTabs", [["rise", "Biggest rises"], ["fall", "Biggest falls"]], dir, function (d) { dir = d; renderExplore(); });
reportSetup("Rise and Fall", function () { return "Sport: " + SP[sport].name; });
show();

} catch (err) { console.error("Rise and Fall problem:", err); }
