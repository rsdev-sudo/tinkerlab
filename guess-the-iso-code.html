<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkerlab — Guess the ISO Code</title>
<meta name="description" content="Match countries to their two-letter ISO codes. A free geography quiz."><!-- tl-meta -->
<meta property="og:title" content="Tinkerlab — Guess the ISO Code">
<meta property="og:description" content="Match countries to their two-letter ISO codes. A free geography quiz.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tinkerlab">

<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #eaf4ff 0%, #eef8ff 50%, #f2fbff 100%); margin: 0; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; min-height: 100vh; }
  a.back { color: #666; font-size: 0.85rem; margin-bottom: 16px; text-decoration: none; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .tag { color: #666; font-size: 0.9rem; margin-top: 4px; }
  .scoreboard { display: flex; gap: 24px; margin-bottom: 20px; font-size: 0.95rem; }
  .scoreboard div { text-align: center; }
  .scoreboard .num { font-size: 1.4rem; font-weight: 700; }
  .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 28px 20px; width: 100%; max-width: 420px; text-align: center; }
  .clue { font-size: 1.15rem; margin-bottom: 24px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button.option { padding: 14px; border-radius: 10px; border: 2px solid #ddd; background: white; font-size: 1.1rem; letter-spacing: 1px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  button.option:hover { border-color: #999; }
  button.option.correct { background: #d4f7dc; border-color: #34c759; }
  button.option.wrong { background: #fbd6d6; border-color: #ff3b30; }
  button.option:disabled { cursor: default; }
  .next-btn { margin-top: 20px; padding: 12px 28px; border-radius: 10px; border: none; background: #111; color: white; font-size: 1rem; cursor: pointer; display: none; }
  .report { margin-top: 22px; text-align: center; }
  .report button { background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
  footer { margin-top: 30px; color: #999; font-size: 0.8rem; text-align: center; }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/consent.js"></script>
</head>
<body>

<a class="back" href="/">← Back to Tinkerlab</a>

<header>
  <h1>🔤 Guess the ISO Code</h1>
  <div class="tag">One country. Four 2-letter codes. Which is real?</div>
</header>

<div class="scoreboard">
  <div><div class="num" id="score">0</div>Score</div>
  <div><div class="num" id="streak">0</div>Streak</div>
  <div><div class="num" id="best">0</div>Best Streak</div>
</div>

<div class="card">
  <div class="clue" id="clue">Loading...</div>
  <div class="options" id="options"></div>
  <button class="next-btn" id="nextBtn">Next →</button>
</div>

<div class="report"><button id="reportBtn">🚩 Report an error in this question</button></div>

<footer>tinkerlab.fyi<br>For entertainment only — facts on this page have not yet been independently verified.<br><a href="/privacy/" style="color:#999;">Privacy</a></footer>

<script>
  // ISO 3166-1 alpha-2 country codes.
  const questions = [
    { country: "Germany", answer: "DE", wrong: ["GE", "DK", "DU"] },
    { country: "Japan", answer: "JP", wrong: ["JA", "JN", "YP"] },
    { country: "Switzerland", answer: "CH", wrong: ["SW", "SZ", "SU"] },
    { country: "Spain", answer: "ES", wrong: ["SP", "SN", "EP"] },
    { country: "Sweden", answer: "SE", wrong: ["SW", "SD", "SV"] },
    { country: "Greece", answer: "GR", wrong: ["GC", "GE", "EL"] },
    { country: "Netherlands", answer: "NL", wrong: ["NE", "HL", "ND"] },
    { country: "Egypt", answer: "EG", wrong: ["EY", "EP", "ET"] },
    { country: "Ireland", answer: "IE", wrong: ["IR", "IL", "IA"] },
    { country: "Thailand", answer: "TH", wrong: ["TL", "TA", "TI"] },
    { country: "Austria", answer: "AT", wrong: ["AU", "AS", "AI"] },
    { country: "Australia", answer: "AU", wrong: ["AT", "AS", "AL"] },
    { country: "Portugal", answer: "PT", wrong: ["PR", "PO", "PG"] },
    { country: "Poland", answer: "PL", wrong: ["PO", "PD", "PN"] },
    { country: "Mexico", answer: "MX", wrong: ["ME", "MC", "MO"] },
    { country: "Peru", answer: "PE", wrong: ["PR", "PU", "PY"] },
    { country: "Kenya", answer: "KE", wrong: ["KN", "KY", "KA"] },
    { country: "Nigeria", answer: "NG", wrong: ["NI", "NA", "NR"] },
    { country: "Denmark", answer: "DK", wrong: ["DE", "DN", "DM"] },
    { country: "Belgium", answer: "BE", wrong: ["BL", "BG", "BB"] },
    { country: "Norway", answer: "NO", wrong: ["NW", "NR", "NY"] },
    { country: "Finland", answer: "FI", wrong: ["FN", "FL", "FD"] },
    { country: "Czechia", answer: "CZ", wrong: ["CE", "CH", "CK"] },
    { country: "Hungary", answer: "HU", wrong: ["HG", "HY", "HN"] },
    { country: "Turkey", answer: "TR", wrong: ["TU", "TK", "TY"] },
    { country: "Russia", answer: "RU", wrong: ["RS", "RO", "RA"] },
    { country: "South Africa", answer: "ZA", wrong: ["SA", "SF", "ZF"] },
    { country: "Morocco", answer: "MA", wrong: ["MO", "MR", "MC"] },
    { country: "Chile", answer: "CL", wrong: ["CH", "CI", "CE"] },
    { country: "Colombia", answer: "CO", wrong: ["CL", "CB", "CM"] },
    { country: "Vietnam", answer: "VN", wrong: ["VI", "VM", "VT"] },
    { country: "Indonesia", answer: "ID", wrong: ["IN", "IA", "IO"] },
    { country: "Philippines", answer: "PH", wrong: ["PL", "PI", "PP"] },
    { country: "Saudi Arabia", answer: "SA", wrong: ["SU", "SD", "AR"] },
    { country: "Israel", answer: "IL", wrong: ["IS", "IR", "IE"] },
    { country: "Iran", answer: "IR", wrong: ["IA", "IN", "IH"] },
    { country: "Pakistan", answer: "PK", wrong: ["PA", "PN", "PI"] },
    { country: "New Zealand", answer: "NZ", wrong: ["NE", "NL", "ZN"] },
    { country: "Ukraine", answer: "UA", wrong: ["UK", "UR", "UN"] },
    { country: "Croatia", answer: "HR", wrong: ["CR", "CA", "HA"] },
    { country: "Singapore", answer: "SG", wrong: ["SI", "SP", "SN"] },
    { country: "Malaysia", answer: "MY", wrong: ["ML", "MA", "MS"] },
    { country: "Cuba", answer: "CU", wrong: ["CB", "CA", "CC"] },
    { country: "Ghana", answer: "GH", wrong: ["GA", "GN", "GG"] },
    { country: "Italy", answer: "IT", wrong: ["IA", "IL", "IY"] },
    { country: "France", answer: "FR", wrong: ["FA", "FC", "FN"] },
    { country: "Brazil", answer: "BR", wrong: ["BZ", "BA", "BL"] },
    { country: "Canada", answer: "CA", wrong: ["CN", "CD", "CY"] }
  ];

  let score = 0, streak = 0, best = 0, current = null;
  const $ = id => document.getElementById(id);
  best = parseInt(localStorage.getItem("tinkerlab_isocode_best") || "0", 10);
  $("best").textContent = best;
  const shuffle = arr => arr.slice().sort(() => Math.random() - 0.5);

  function loadQuestion() {
    current = questions[Math.floor(Math.random() * questions.length)];
    $("clue").textContent = "What is the ISO code for " + current.country + "?";
    const opts = shuffle([current.answer, ...current.wrong]);
    $("options").innerHTML = "";
    opts.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(btn, opt);
      $("options").appendChild(btn);
    });
    $("nextBtn").style.display = "none";
  }

  function handleAnswer(btn, chosen) {
    const all = $("options").querySelectorAll("button");
    all.forEach(b => b.disabled = true);
    if (chosen === current.answer) {
      btn.classList.add("correct");
      score++; streak++;
      if (streak > best) { best = streak; try { localStorage.setItem("tinkerlab_isocode_best", best); } catch (e) {} }
    } else {
      btn.classList.add("wrong");
      streak = 0;
      all.forEach(b => { if (b.textContent === current.answer) b.classList.add("correct"); });
    }
    $("score").textContent = score;
    $("streak").textContent = streak;
    $("best").textContent = best;
    $("nextBtn").style.display = "inline-block";
  }

  const REPORT_EMAIL = "hello@rssolutions.uk";
  $("reportBtn").onclick = () => {
    const body = "Game: Guess the ISO Code\nCountry: " + current.country + "\nAnswer in game: " + current.answer + "\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };

  $("nextBtn").onclick = loadQuestion;
  loadQuestion();
</script>

</body>
</html>
