<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkerlab — Guess the Driving Side</title>
<meta name="description" content="Do they drive on the left or the right? Test your knowledge of driving sides around the world."><!-- tl-meta -->
<meta property="og:title" content="Tinkerlab — Guess the Driving Side">
<meta property="og:description" content="Do they drive on the left or the right? Test your knowledge of driving sides around the world.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tinkerlab">

<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f4f0ff 50%, #fdf0ff 100%); margin: 0; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; min-height: 100vh; }
  a.back { color: #666; font-size: 0.85rem; margin-bottom: 16px; text-decoration: none; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .tag { color: #666; font-size: 0.9rem; margin-top: 4px; }
  .scoreboard { display: flex; gap: 24px; margin-bottom: 20px; font-size: 0.95rem; }
  .scoreboard div { text-align: center; }
  .scoreboard .num { font-size: 1.4rem; font-weight: 700; }
  .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 28px 20px; width: 100%; max-width: 420px; text-align: center; }
  .clue { font-size: 1.3rem; margin-bottom: 26px; font-weight: 600; }
  .options { display: flex; gap: 12px; }
  button.option { flex: 1; padding: 18px 10px; border-radius: 10px; border: 2px solid #ddd; background: white; font-size: 1rem; cursor: pointer; transition: all 0.15s; }
  button.option:hover { border-color: #999; }
  button.option.correct { background: #d4f7dc; border-color: #34c759; }
  button.option.wrong { background: #fbd6d6; border-color: #ff3b30; }
  button.option:disabled { cursor: default; }
  .next-btn { margin-top: 20px; padding: 12px 28px; border-radius: 10px; border: none; background: #111; color: white; font-size: 1rem; cursor: pointer; display: none; }
  .report { margin-top: 22px; text-align: center; }
  .report button { background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
  footer { margin-top: 30px; color: #999; font-size: 0.8rem; text-align: center; }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/consent.js"></script>
</head>
<body>

<a class="back" href="/">← Back to Tinkerlab</a>

<header>
  <h1>🚗 Guess the Driving Side</h1>
  <div class="tag">Left-hand or right-hand traffic — do you know?</div>
</header>

<div class="scoreboard">
  <div><div class="num" id="score">0</div>Score</div>
  <div><div class="num" id="streak">0</div>Streak</div>
  <div><div class="num" id="best">0</div>Best Streak</div>
</div>

<div class="card">
  <div class="clue" id="clue">Loading...</div>
  <div class="options" id="options">
    <button class="option" id="leftBtn">⬅️ Left</button>
    <button class="option" id="rightBtn">Right ➡️</button>
  </div>
  <button class="next-btn" id="nextBtn">Next →</button>
</div>

<div class="report"><button id="reportBtn">🚩 Report an error in this question</button></div>

<footer>tinkerlab.fyi<br>For entertainment only — facts on this page have not yet been independently verified.<br><a href="/privacy/" style="color:#999;">Privacy</a></footer>

<script>
  // "left" or "right" refers to which side of the road traffic drives on.
  const questions = [
    { country: "United Kingdom", answer: "left" },
    { country: "Japan", answer: "left" },
    { country: "Australia", answer: "left" },
    { country: "India", answer: "left" },
    { country: "South Africa", answer: "left" },
    { country: "New Zealand", answer: "left" },
    { country: "Thailand", answer: "left" },
    { country: "Ireland", answer: "left" },
    { country: "Kenya", answer: "left" },
    { country: "Indonesia", answer: "left" },
    { country: "Malaysia", answer: "left" },
    { country: "United States", answer: "right" },
    { country: "Germany", answer: "right" },
    { country: "France", answer: "right" },
    { country: "Brazil", answer: "right" },
    { country: "China", answer: "right" },
    { country: "Mexico", answer: "right" },
    { country: "Russia", answer: "right" },
    { country: "Egypt", answer: "right" },
    { country: "Spain", answer: "right" },
    { country: "Turkey", answer: "right" },
    { country: "South Korea", answer: "right" },
    { country: "Pakistan", answer: "left" },
    { country: "Bangladesh", answer: "left" },
    { country: "Sri Lanka", answer: "left" },
    { country: "Nepal", answer: "left" },
    { country: "Singapore", answer: "left" },
    { country: "Tanzania", answer: "left" },
    { country: "Uganda", answer: "left" },
    { country: "Zimbabwe", answer: "left" },
    { country: "Malta", answer: "left" },
    { country: "Cyprus", answer: "left" },
    { country: "Jamaica", answer: "left" },
    { country: "Canada", answer: "right" },
    { country: "Argentina", answer: "right" },
    { country: "Italy", answer: "right" },
    { country: "Poland", answer: "right" },
    { country: "Nigeria", answer: "right" },
    { country: "Saudi Arabia", answer: "right" },
    { country: "Vietnam", answer: "right" },
    { country: "Philippines", answer: "right" },
    { country: "Sweden", answer: "right" },
    { country: "Myanmar", answer: "right" },
    { country: "Mozambique", answer: "left" },
    { country: "Zambia", answer: "left" },
    { country: "Botswana", answer: "left" },
    { country: "Bahamas", answer: "left" },
    { country: "Fiji", answer: "left" },
    { country: "Namibia", answer: "left" },
    { country: "Bhutan", answer: "left" },
    { country: "Brunei", answer: "left" },
    { country: "Guyana", answer: "left" }
  ];

  let score = 0, streak = 0, best = 0, current = null;
  const $ = id => document.getElementById(id);
  best = parseInt(localStorage.getItem("tinkerlab_drivingside_best") || "0", 10);
  $("best").textContent = best;

  function loadQuestion() {
    current = questions[Math.floor(Math.random() * questions.length)];
    $("clue").textContent = "Which side of the road do they drive on in " + current.country + "?";
    $("leftBtn").disabled = false;
    $("rightBtn").disabled = false;
    $("leftBtn").className = "option";
    $("rightBtn").className = "option";
    $("nextBtn").style.display = "none";
  }

  function handleAnswer(chosen) {
    $("leftBtn").disabled = true;
    $("rightBtn").disabled = true;
    const chosenBtn = chosen === "left" ? $("leftBtn") : $("rightBtn");
    const otherBtn = chosen === "left" ? $("rightBtn") : $("leftBtn");

    if (chosen === current.answer) {
      chosenBtn.classList.add("correct");
      score++; streak++;
      if (streak > best) { best = streak; try { localStorage.setItem("tinkerlab_drivingside_best", best); } catch (e) {} }
    } else {
      chosenBtn.classList.add("wrong");
      const correctBtn = current.answer === "left" ? $("leftBtn") : $("rightBtn");
      correctBtn.classList.add("correct");
      streak = 0;
    }
    $("score").textContent = score;
    $("streak").textContent = streak;
    $("best").textContent = best;
    $("nextBtn").style.display = "inline-block";
  }

  $("leftBtn").onclick = () => handleAnswer("left");
  $("rightBtn").onclick = () => handleAnswer("right");

  const REPORT_EMAIL = "hello@rssolutions.uk";
  $("reportBtn").onclick = () => {
    const body = "Game: Guess the Driving Side\nCountry: " + current.country + "\nAnswer in game: " + current.answer + "\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };

  $("nextBtn").onclick = loadQuestion;
  loadQuestion();
</script>

</body>
</html>
