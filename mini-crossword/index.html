<style>
  * { box-sizing: border-box; }

  header { text-align: center; margin-bottom: 6px; }

  .tag { color: #666; font-size: 0.9rem; margin-top: 4px; margin-bottom: 18px; }

  /* Index / picker view */
  .picker-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 360px;
  }
  .picker-btn {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 2px solid #eee;
    background: white;
    font-size: 1rem;
    font-weight: 700;
    color: #444;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .picker-btn:hover { border-color: #b8860b; }
  .picker-btn.done { background: #fff3cd; border-color: #ffd580; color: #8a6a00; }
  .picker-btn .check { position: absolute; top: 2px; right: 4px; font-size: 0.65rem; }

  /* Puzzle view */
  #puzzleView { display: none; flex-direction: column; align-items: center; width: 100%; }
  .puzzle-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  a.toindex { color: #666; font-size: 0.85rem; text-decoration: none; }
  .puzzlenum { color: #b8860b; font-size: 0.9rem; font-weight: 700; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
    background: #333;
    padding: 3px;
    border-radius: 6px;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1 / 1;
    margin-bottom: 20px;
  }
  .cell { background: white; position: relative; display: flex; align-items: center; justify-content: center; }
  .cell.block { background: #333; }
  .cell input {
    width: 100%; height: 100%; border: none; text-align: center; font-size: 1.3rem; font-weight: 700;
    text-transform: uppercase; background: transparent; outline: none; caret-color: transparent;
  }
  .cell input:focus { background: #fff3cd; }
  .cell.active-word input:not(:focus) { background: #fffaf0; }
  .cell.correct input { background: #d4f7dc !important; color: #1a7a3a; }
  .cell.wrong input { background: #fbd6d6 !important; }
  .cell-number { position: absolute; top: 2px; left: 3px; font-size: 0.6rem; color: #888; font-weight: 600; }
  .clue-box {
    background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 16px 18px;
    width: 100%; max-width: 320px; margin-bottom: 16px; text-align: center; font-size: 0.95rem;

  .controls { display: flex; gap: 10px; margin-bottom: 10px; }
  .controls button { padding: 10px 18px; border-radius: 10px; border: 2px solid #ddd; background: white; font-size: 0.9rem; cursor: pointer; }
  .controls button:hover { border-color: #b8860b; }
  .win-banner {

  footer { margin-top: 24px; color: #999; font-size: 0.8rem; text-align: center; }

  const SIZE = 5;

  const pickerGrid = document.getElementById("pickerGrid");
  const pickerView = document.getElementById("pickerView");
  const puzzleView = document.getElementById("puzzleView");
  const clueBox = document.getElementById("clueBox");
  const headerTag = document.getElementById("headerTag");

  function getCompleted() {
    try { return JSON.parse(localStorage.getItem("tinkerlab_crossword_completed_v2") || "[]"); }
    catch (e) { return []; }
  }
  function markCompleted(n) {
    const done = getCompleted();
    if (!done.includes(n)) {
      done.push(n);
      try { localStorage.setItem("tinkerlab_crossword_completed_v2", JSON.stringify(done)); } catch (e) {}
    }
  }

  function buildPicker() {
    const done = getCompleted();
    pickerGrid.innerHTML = "";
    for (let n = 1; n <= puzzles.length; n++) {
      const btn = document.createElement("button");
      btn.className = "picker-btn" + (done.includes(n) ? " done" : "");
      btn.textContent = n;
      if (done.includes(n)) {
        const check = document.createElement("span");
        check.className = "check";
        check.textContent = "✓";
        btn.appendChild(check);
      }
      btn.onclick = () => openPuzzle(n - 1);
      pickerGrid.appendChild(btn);
    }
    const doneCount = done.length;
    headerTag.textContent = doneCount > 0
      ? "Pick a puzzle. " + doneCount + " of " + puzzles.length + " solved so far."
      : "Pick a puzzle. 50 tiny 5×5 crosswords to work through.";
  }

  function openPuzzle(index) {
    currentPuzzleIndex = index;
    pickerView.style.display = "none";
    puzzleView.style.display = "flex";
    document.getElementById("puzzleNum").textContent = "Puzzle #" + (index + 1);
    document.getElementById("winBanner").style.display = "none";
    buildGrid();
  }

  function backToIndex(e) {
    if (e) e.preventDefault();
    puzzleView.style.display = "none";
    pickerView.style.display = "block";
    buildPicker();
  }
  document.getElementById("toIndexBtn").onclick = backToIndex;

  function buildGrid() {
    const puzzle = puzzles[currentPuzzleIndex];
    document.getElementById("grid").innerHTML = "";
    cells = [];
    activeDir = "across";
    activeWord = null;
    clueBox.textContent = "Tap a square to see its clue";

    for (let r = 0; r < SIZE; r++) {
      cells.push([]);
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const sol = puzzle.solution[idx];
        const cellDiv = document.createElement("div");
        if (sol === "#") {
          cellDiv.className = "cell block";
          document.getElementById("grid").appendChild(cellDiv);
          cells[r].push(null);
          continue;
        }
        cellDiv.className = "cell";
        const num = findClueNumber(puzzle, r, c);
        if (num) {
          const numEl = document.createElement("div");
          numEl.className = "cell-number";
          numEl.textContent = num;
          cellDiv.appendChild(numEl);
        }
        const input = document.createElement("input");
        input.maxLength = 1;
        input.dataset.row = r;
        input.dataset.col = c;
        input.addEventListener("input", onType);
        input.addEventListener("click", () => selectCell(r, c));
        input.addEventListener("keydown", onKeyDown);
        cellDiv.appendChild(input);
        document.getElementById("grid").appendChild(cellDiv);
        cells[r].push(input);
      }
    }
  }

  function findClueNumber(puzzle, r, c) {
    const a = puzzle.across.find(w => w.row === r && w.col === c);
    const d = puzzle.down.find(w => w.row === r && w.col === c);
    return (a || d) ? (a ? a.num : d.num) : null;
  }

  function getWordAt(r, c, dir) {
    const puzzle = puzzles[currentPuzzleIndex];
    const list = dir === "across" ? puzzle.across : puzzle.down;
    return list.find(w => {
      if (dir === "across") return w.row === r && c >= w.col && c < w.col + w.answer.length;
      return w.col === c && r >= w.row && r < w.row + w.answer.length;
    });
  }

  function clearHighlight() {
    document.querySelectorAll(".cell.active-word").forEach(el => el.classList.remove("active-word"));
  }

  function highlightWord(word, dir) {
    clearHighlight();
    for (let i = 0; i < word.answer.length; i++) {
      const r = dir === "across" ? word.row : word.row + i;
      const c = dir === "across" ? word.col + i : word.col;
      if (cells[r][c]) cells[r][c].parentElement.classList.add("active-word");
    }
    clueBox.innerHTML = '<span class="dir">' + (dir === "across" ? "ACROSS" : "DOWN") + '</span>' + word.clue;
  }

  function selectCell(r, c) {
    let word = getWordAt(r, c, activeDir);
    if (!word) {
      activeDir = activeDir === "across" ? "down" : "across";
      word = getWordAt(r, c, activeDir);
    }
    if (!word) return;
    activeWord = word;
    highlightWord(word, activeDir);
    cells[r][c].focus();
  }

    if (activeWord) {
      const i = activeDir === "across" ? c - activeWord.col : r - activeWord.row;
      const nextR = activeDir === "across" ? r : r + 1;
      const nextC = activeDir === "across" ? c + 1 : c;
      if (i < activeWord.answer.length - 1 && cells[nextR] && cells[nextR][nextC]) {
        cells[nextR][nextC].focus();
      }
    }
    checkWinSilently();
  }

  function onKeyDown(e) {
    const r = parseInt(e.target.dataset.row), c = parseInt(e.target.dataset.col);
    if (e.key === "Backspace" && !e.target.value && activeWord) {
      const i = activeDir === "across" ? c - activeWord.col : r - activeWord.row;
      const prevR = activeDir === "across" ? r : r - 1;
      const prevC = activeDir === "across" ? c - 1 : c;
      if (i > 0 && cells[prevR] && cells[prevR][prevC]) cells[prevR][prevC].focus();
    }
    if (e.key === "ArrowRight" && cells[r][c+1]) cells[r][c+1].focus();
    if (e.key === "ArrowLeft" && cells[r][c-1]) cells[r][c-1].focus();
    if (e.key === "ArrowDown" && cells[r+1] && cells[r+1][c]) cells[r+1][c].focus();
    if (e.key === "ArrowUp" && cells[r-1] && cells[r-1][c]) cells[r-1][c].focus();
  }

  function checkAll() {
    const puzzle = puzzles[currentPuzzleIndex];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const sol = puzzle.solution[idx];
        if (sol === "#" || !cells[r][c]) continue;
        const val = cells[r][c].value.toUpperCase();
        const parent = cells[r][c].parentElement;
        parent.classList.remove("correct", "wrong");
        if (!val) continue;
        parent.classList.add(val === sol ? "correct" : "wrong");
      }
    }
    checkWinSilently();
  }

  function checkWinSilently() {
    const puzzle = puzzles[currentPuzzleIndex];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const sol = puzzle.solution[idx];
        if (sol === "#") continue;
        if (!cells[r][c] || cells[r][c].value.toUpperCase() !== sol) return;
      }
    }
    document.getElementById("winBanner").style.display = "block";
    markCompleted(currentPuzzleIndex + 1);
  }

  function revealLetter() {
    const active = document.activeElement;
    if (active && active.tagName === "INPUT" && active.dataset.row !== undefined) {
      const puzzle = puzzles[currentPuzzleIndex];
      const r = parseInt(active.dataset.row), c = parseInt(active.dataset.col);
      const sol = puzzle.solution[r * SIZE + c];
      active.value = sol;
      active.parentElement.classList.remove("wrong");
      active.parentElement.classList.add("correct");
      checkWinSilently();
    } else {
      clueBox.textContent = "Click a square first, then press Reveal.";
    }
  }

  document.getElementById("checkBtn").onclick = checkAll;
  document.getElementById("revealBtn").onclick = revealLetter;

  const REPORT_EMAIL = "hello@rssolutions.uk";
  document.getElementById("reportBtn").onclick = () => {
    const puzNum = currentPuzzleIndex !== null ? (currentPuzzleIndex + 1) : "(on the index screen)";
    const body = "Game: Mini Crossword\nPuzzle #: " + puzNum + "\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };

  buildPicker();
</script>
