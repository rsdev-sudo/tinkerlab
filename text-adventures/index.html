<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinkerlab — Text Adventures</title>
<meta name="description" content="Free browser text adventures with multiple endings. Pick a story and start playing."><!-- tl-meta -->
<meta property="og:title" content="Tinkerlab — Text Adventures">
<meta property="og:description" content="Free browser text adventures with multiple endings. Pick a story and start playing.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tinkerlab">

<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #fff7e6 0%, #fff1e0 50%, #ffe9d6 100%);
    margin: 0;
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  a.back { color: #666; font-size: 0.85rem; margin-bottom: 20px; text-decoration: none; }
  header { text-align: center; margin-bottom: 36px; }
  h1 { margin: 0; font-size: 1.8rem; }
  .tag { color: #666; margin-top: 6px; max-width: 480px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 700px;
  }
  a.tile {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px 20px;
    text-decoration: none;
    color: #111;
    transition: transform 0.15s;
  }
  a.tile:hover { transform: translateY(-3px); }
  .thumb {
    --grad: linear-gradient(135deg, #ddd, #eee);
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    overflow: hidden;
    transition: background 0.25s ease;
  }
  .thumb .icon {
    position: absolute;
    font-size: 2.6rem;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .thumb .label {
    position: relative;
    z-index: 2;
    font-weight: 600;
    font-size: 0.95rem;
    color: #555;
    text-align: center;
    padding: 0 10px;
    transition: color 0.25s ease, text-shadow 0.25s ease;
  }
  a.tile:hover .thumb { background: var(--grad); }
  a.tile:hover .thumb .icon { opacity: 0.9; }
  a.tile:hover .thumb .label {
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }
  .tile p { color: #777; font-size: 0.85rem; margin: 0; }
  .tile.soon { opacity: 0.55; pointer-events: none; }
  .tile.soon p.soon-label {
    color: #999;
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    margin-top: 6px;
  }
  footer { margin-top: 40px; color: #999; font-size: 0.8rem; }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/consent.js"></script>
</head>
<body>

<a class="back" href="/">← Back to Tinkerlab</a>

<header>
  <h1>📖 Text Adventures</h1>
  <div class="tag">Short, choice-driven stories. Some may end up more connected than they first appear.</div>
</header>

<div class="grid">
  <a class="tile" href="/text-adventures/dreammakers-workshop/">
    <div class="thumb" style="--grad: linear-gradient(135deg, #f6d365, #fda085);">
      <span class="icon">🧸</span>
      <span class="label">The Dreammaker's Workshop</span>
    </div>
    <p>Six endings, many paths to find them.</p>
  </a>

  <div class="tile soon">
    <div class="thumb" style="--grad: linear-gradient(135deg, #a1c4fd, #c2e9fb);">
      <span class="icon">🗝️</span>
      <span class="label">Next story</span>
    </div>
    <p class="soon-label">Coming soon</p>
  </div>

  <div class="tile soon">
    <div class="thumb" style="--grad: linear-gradient(135deg, #d4fc79, #96e6a1);">
      <span class="icon">🌙</span>
      <span class="label">Next story</span>
    </div>
    <p class="soon-label">Coming soon</p>
  </div>
</div>

<footer>tinkerlab.fyi<br><a href="/privacy/" style="color:#999;">Privacy</a></footer>

</body>
</html>
