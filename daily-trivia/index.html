      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    };
  }

  const launchDate = new Date(2026, 8, 30); // Sept 30, 2026
  const dayNumber = Math.max(1, Math.floor((new Date().setHours(0,0,0,0) - launchDate.setHours(0,0,0,0)) / 86400000) + 1);
  document.getElementById("dayNum").textContent = "Tinkerlab Daily #" + dayNumber;

  // ---- Streak + completion tracking ----
  const $ = id => document.getElementById(id);
  let streak = parseInt(localStorage.getItem("tinkerlab_daily_streak") || "0", 10);
  let bestStreak = parseInt(localStorage.getItem("tinkerlab_daily_best") || "0", 10);
  const lastPlayed = localStorage.getItem("tinkerlab_daily_lastplayed");
  const lastScoreRaw = localStorage.getItem("tinkerlab_daily_lastscore");

  $("streak").textContent = streak;
  $("bestStreak").textContent = bestStreak;

  let qIndex = 0, correctCount = 0, current = null;
  const shuffleOpts = arr => arr.slice().sort(() => Math.random() - 0.5);

  function renderQuestion() {
    current = todaysQuestions[qIndex];
    const opts = shuffleOpts([current.answer, ...current.wrong]);
    $("card").innerHTML =
      '<div class="qcount">Question ' + (qIndex + 1) + ' of 5</div>' +
      '<div class="category">' + current.cat + '</div>' +
      '<div class="clue">' + current.clue + '</div>' +
      '<div class="options" id="options"></div>' +
      '<button class="next-btn" id="nextBtn">Next →</button>';

    const optionsEl = $("options");
    opts.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(btn, opt);
      optionsEl.appendChild(btn);
    });
  }

  function handleAnswer(btn, chosen) {
    const all = $("options").querySelectorAll("button");
    all.forEach(b => b.disabled = true);
    if (chosen === current.answer) {
      btn.classList.add("correct");
      correctCount++;
    } else {
      btn.classList.add("wrong");
      all.forEach(b => { if (b.textContent === current.answer) b.classList.add("correct"); });
    }
    $("nextBtn").style.display = "inline-block";
    $("nextBtn").onclick = () => {
      qIndex++;
      if (qIndex < 5) { renderQuestion(); } else { finishDay(); }
    };
  }

  function finishDay() {
    // Update streak: if played yesterday, extend; if played today already (shouldn't happen), keep; otherwise reset to 1.
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yKey = yesterday.getFullYear() + "-" + (yesterday.getMonth() + 1) + "-" + yesterday.getDate();

    if (lastPlayed === yKey) {
      streak = streak + 1;
    } else if (lastPlayed !== dateKey) {
      streak = 1;
    }
    if (streak > bestStreak) bestStreak = streak;

    try {
      localStorage.setItem("tinkerlab_daily_streak", streak);
      localStorage.setItem("tinkerlab_daily_best", bestStreak);
      localStorage.setItem("tinkerlab_daily_lastplayed", dateKey);
      localStorage.setItem("tinkerlab_daily_lastscore", correctCount);
    } catch (e) {}

    $("streak").textContent = streak;
    $("bestStreak").textContent = bestStreak;
    showResult(correctCount);
  }

  function showResult(score) {
    const emoji = score === 5 ? "🏆" : score >= 3 ? "🌙" : "✨";
    $("card").innerHTML =
      '<div class="result-emoji">' + emoji + '</div>' +
      '<div class="result-score">' + score + ' / 5</div>' +
      '<div class="result-sub">Daily #' + dayNumber + ' · Streak: ' + streak + '</div>' +
      '<button class="share-btn" id="shareBtn">Copy result</button>' +
      '<div class="already-note">Come back tomorrow for the next one.</div>';

    $("shareBtn").onclick = () => {
      const text = "Tinkerlab Daily #" + dayNumber + " — " + score + "/5 🧠 (Streak: " + streak + ")\\ntinkerlab.fyi/daily-trivia";
      navigator.clipboard?.writeText(text).then(() => {
        $("shareBtn").textContent = "Copied!";
        setTimeout(() => { $("shareBtn").textContent = "Copy result"; }, 1500);
      });
    };
  }

  // If already played today, show the locked result instead of letting them replay.
  if (lastPlayed === dateKey && lastScoreRaw !== null) {
    showResult(parseInt(lastScoreRaw, 10));
  } else {
    renderQuestion();
  }

  const REPORT_EMAIL = "hello@rssolutions.uk";
  $("reportBtn").onclick = () => {
    const body = "Game: Daily Trivia\nDay #: " + dayNumber + "\nQuestion: " + (current ? current.clue : "(already completed today)") + "\n\nWhat looks wrong?\n";
    location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Tinkerlab error report") + "&body=" + encodeURIComponent(body);
  };
</script>

</body>
</html>
