  let mode = "Football", score = 0, streak = 0, best = 0, cur = null, order = [], done = false;
  const $ = id => document.getElementById(id);
  const KEY = () => "tinkerlab_rank_seasons_best";
  try { best = parseInt(localStorage.getItem(KEY()) || "0", 10); } catch (e) {}

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function pick() {
    const teams = DATA[mode];
    for (let tries = 0; tries < 200; tries++) {
      const t = teams[Math.floor(Math.random() * teams.length)];
      const chosen = [];
      const used = new Set();
      for (const s of shuffle(t.s)) { if (!used.has(s[1])) { used.add(s[1]); chosen.push(s); } if (chosen.length === 5) break; }

    }
  }
  function render() {
    $("teamName").textContent = cur.name;

        const s = order[i];
        d.innerHTML = '<span><span class="n">' + (i + 1) + '</span>' + s[0] + '</span><span class="r"></span>';
